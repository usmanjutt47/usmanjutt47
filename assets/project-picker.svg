<svg xmlns="http://www.w3.org/2000/svg" width="390" height="140" viewBox="0 0 390 140">
  <defs>
    <linearGradient id="bGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#22D3EE"/>
      <animate attributeName="x1" values="0%;60%;0%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="0%;60%;0%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="cardClip"><rect x="1" y="1" width="388" height="138" rx="12"/></clipPath>
  </defs>
  <rect x="1" y="1" width="388" height="138" rx="12" fill="#0D1117" stroke="url(#bGrad)" stroke-width="2"/>
  <g clip-path="url(#cardClip)">
    <rect x="-120" y="0" width="70" height="140" fill="#FFFFFF" opacity="0.06" transform="skewX(-18)">
      <animate attributeName="x" values="-160;520" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="24" y="40" font-family="Verdana, Geneva, sans-serif" font-size="16.5" font-weight="bold" fill="#60A5FA">🌍 expo-country-picker</text>
  <text x="24" y="66" font-family="Verdana, Geneva, sans-serif" font-size="11.5" fill="#CBD5E1">Reusable country picker for React Native &amp; Expo —</text>
  <text x="24" y="83" font-family="Verdana, Geneva, sans-serif" font-size="11.5" fill="#CBD5E1">flags, dial codes, live search &amp; multi-select.</text>
  <g font-family="Verdana, Geneva, sans-serif" font-size="10" fill="#DBEAFE">
    <rect x="24" y="102" width="86" height="19" rx="9.5" fill="#1E3A8A"/><text x="67" y="115" text-anchor="middle">React Native</text>
    <rect x="118" y="102" width="46" height="19" rx="9.5" fill="#1E3A8A"/><text x="141" y="115" text-anchor="middle">Expo</text>
    <rect x="172" y="102" width="70" height="19" rx="9.5" fill="#1E3A8A"/><text x="207" y="115" text-anchor="middle">JavaScript</text>
  </g>
</svg>
