<svg xmlns="http://www.w3.org/2000/svg" width="390" height="140" viewBox="0 0 390 140">
  <defs>
    <linearGradient id="bGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#2563EB"/>
      <animate attributeName="x1" values="0%;60%;0%" dur="6s" begin="-3s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="0%;60%;0%" dur="6s" begin="-3s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="cardClip2"><rect x="1" y="1" width="388" height="138" rx="12"/></clipPath>
  </defs>
  <rect x="1" y="1" width="388" height="138" rx="12" fill="#0D1117" stroke="url(#bGrad2)" stroke-width="2"/>
  <g clip-path="url(#cardClip2)">
    <rect x="-120" y="0" width="70" height="140" fill="#FFFFFF" opacity="0.06" transform="skewX(-18)">
      <animate attributeName="x" values="-160;520" dur="4.5s" begin="-2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="24" y="40" font-family="Verdana, Geneva, sans-serif" font-size="16.5" font-weight="bold" fill="#60A5FA">🗺️ Google-Maps-Scrapper</text>
  <text x="24" y="66" font-family="Verdana, Geneva, sans-serif" font-size="11.5" fill="#CBD5E1">Extracts business leads from Google Maps into Excel —</text>
  <text x="24" y="83" font-family="Verdana, Geneva, sans-serif" font-size="11.5" fill="#CBD5E1">emails, phone numbers &amp; websites, automatically.</text>
  <g font-family="Verdana, Geneva, sans-serif" font-size="10" fill="#DBEAFE">
    <rect x="24" y="102" width="54" height="19" rx="9.5" fill="#1E3A8A"/><text x="51" y="115" text-anchor="middle">Python</text>
    <rect x="86" y="102" width="72" height="19" rx="9.5" fill="#1E3A8A"/><text x="122" y="115" text-anchor="middle">Playwright</text>
    <rect x="166" y="102" width="46" height="19" rx="9.5" fill="#1E3A8A"/><text x="189" y="115" text-anchor="middle">Excel</text>
  </g>
