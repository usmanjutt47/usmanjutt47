<svg xmlns="http://www.w3.org/2000/svg" width="800" height="24" viewBox="0 0 800 24">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="11" width="800" height="2" fill="url(#lineGrad)"/>
  <circle r="4" cy="12" fill="#93C5FD">
    <animate attributeName="cx" values="0;800;0" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0;1;1;0" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle r="8" cy="12" fill="#2563EB" opacity="0.35">
    <animate attributeName="cx" values="0;800;0" dur="7s" repeatCount="indefinite"/>
  </circle>
</svg>
