<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#60A5FA">
        <animate attributeName="stop-color" values="#60A5FA;#22D3EE;#818CF8;#60A5FA" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FFFFFF"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <g id="cube">
      <polygon points="0,-60 52,-30 0,0 -52,-30" fill="#93C5FD"/>
      <polygon points="-52,-30 0,0 0,60 -52,30" fill="#2563EB"/>
      <polygon points="0,0 52,-30 52,30 0,60" fill="#1E40AF"/>
      <polyline points="-52,-30 0,0 52,-30" fill="none" stroke="#DBEAFE" stroke-width="1.5" opacity="0.8"/>
      <line x1="0" y1="0" x2="0" y2="60" stroke="#DBEAFE" stroke-width="1.5" opacity="0.8"/>
    </g>
    <g id="cubeSm">
      <polygon points="0,-24 21,-12 0,0 -21,-12" fill="#93C5FD"/>
      <polygon points="-21,-12 0,0 0,24 -21,12" fill="#3B82F6"/>
      <polygon points="0,0 21,-12 21,12 0,24" fill="#1D4ED8"/>
    </g>
  </defs>

  <rect width="800" height="400" fill="url(#bgGrad)"/>
  <circle cx="400" cy="150" r="190" fill="url(#glow)">
    <animate attributeName="r" values="180;205;180" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- particles -->
  <g fill="#60A5FA">
    <circle cx="90" cy="80" r="3" opacity="0.7"><animateTransform attributeName="transform" type="translate" values="0,0;0,-14;0,0" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="300" r="2.5" opacity="0.5"><animateTransform attributeName="transform" type="translate" values="0,0;0,-18;0,0" dur="6s" begin="-2s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="90" r="3" opacity="0.6"><animateTransform attributeName="transform" type="translate" values="0,0;0,-12;0,0" dur="4.5s" begin="-1s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="290" r="2.5" opacity="0.5"><animateTransform attributeName="transform" type="translate" values="0,0;0,-16;0,0" dur="5.5s" begin="-3s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="60" r="2" opacity="0.6"><animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="4s" begin="-0.5s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="330" r="2" opacity="0.5"><animateTransform attributeName="transform" type="translate" values="0,0;0,-12;0,0" dur="6.5s" begin="-4s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="210" r="2" opacity="0.5"><animateTransform attributeName="transform" type="translate" values="0,0;0,-15;0,0" dur="5.2s" begin="-2.5s" repeatCount="indefinite"/></circle>
    <circle cx="755" cy="180" r="2" opacity="0.6"><animateTransform attributeName="transform" type="translate" values="0,0;0,-11;0,0" dur="4.8s" begin="-1.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- orbit rings -->
  <g fill="none" stroke="#3B82F6">
    <ellipse cx="400" cy="150" rx="175" ry="57" stroke-width="1.5" opacity="0.55" stroke-dasharray="7 6">
      <animateTransform attributeName="transform" type="rotate" from="0 400 150" to="360 400 150" dur="26s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="400" cy="150" rx="215" ry="74" stroke-width="1" opacity="0.35" stroke-dasharray="4 8">
      <animateTransform attributeName="transform" type="rotate" from="360 400 150" to="0 400 150" dur="34s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- orbiting mini cubes -->
  <g>
    <animateMotion dur="11s" repeatCount="indefinite" path="M 225,150 a175,57 0 1,0 350,0 a175,57 0 1,0 -350,0"/>
    <use href="#cubeSm"/>
  </g>
  <g>
    <animateMotion dur="17s" repeatCount="indefinite" path="M 615,150 a215,74 0 1,0 -430,0 a215,74 0 1,0 430,0"/>
    <use href="#cubeSm" opacity="0.85"/>
  </g>

  <!-- side floating cubes -->
  <g transform="translate(140,120)">
    <animateTransform attributeName="transform" type="translate" values="140,120;140,104;140,120" dur="6s" repeatCount="indefinite" additive="replace"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-7;7;-7" dur="8s" repeatCount="indefinite"/>
      <use href="#cube" transform="scale(0.55)" opacity="0.9"/>
    </g>
  </g>
  <g transform="translate(668,128)">
    <animateTransform attributeName="transform" type="translate" values="668,128;668,146;668,128" dur="7s" begin="-3s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="6;-6;6" dur="9s" repeatCount="indefinite"/>
      <use href="#cube" transform="scale(0.45)" opacity="0.85"/>
    </g>
  </g>

  <!-- main 3D cube -->
  <g transform="translate(400,150)">
    <animateTransform attributeName="transform" type="translate" values="400,150;400,138;400,150" dur="5s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-5;5;-5" dur="7s" repeatCount="indefinite"/>
      <use href="#cube" transform="scale(1.25)"/>
    </g>
  </g>

  <!-- name -->
  <text x="400" y="302" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="39" font-weight="bold" letter-spacing="2" fill="url(#textGrad)">MUHAMMAD USMAN TARIQ</text>
  <text x="400" y="338" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="16" letter-spacing="3" fill="#94A3B8">MOBILE ENGINEER • FULL STACK DEVELOPER • PRODUCT BUILDER</text>
  <rect x="290" y="356" width="220" height="3" rx="1.5" fill="#2563EB">
    <animate attributeName="width" values="220;120;220" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="x" values="290;340;290" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
