<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0118"/>
      <stop offset="55%" stop-color="#1B0533"/>
      <stop offset="100%" stop-color="#2D0A4E"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F9A8D4">
        <animate attributeName="stop-color" values="#F9A8D4;#C4B5FD;#67E8F9;#F9A8D4" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <g id="cube2">
      <polygon points="0,-44 38,-22 0,0 -38,-22" fill="#F9A8D4"/>
      <polygon points="-38,-22 0,0 0,44 -38,22" fill="#8B5CF6"/>
      <polygon points="0,0 38,-22 38,22 0,44" fill="#6D28D9"/>
    </g>
  </defs>

  <rect width="800" height="420" fill="url(#bg2)"/>
  <circle cx="150" cy="90" r="170" fill="url(#blob1)">
    <animate attributeName="cx" values="150;210;150" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="90;130;90" dur="13s" repeatCount="indefinite"/>
  </circle>
  <circle cx="680" cy="320" r="180" fill="url(#blob2)">
    <animate attributeName="cx" values="680;620;680" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="320;270;320" dur="10s" repeatCount="indefinite"/>
  </circle>

  <g fill="#C4B5FD">
    <circle cx="70" cy="300" r="2.5" opacity="0.7"><animateTransform attributeName="transform" type="translate" values="0,0;0,-16;0,0" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="80" r="2.5" opacity="0.7"><animateTransform attributeName="transform" type="translate" values="0,0;0,-14;0,0" dur="4.5s" begin="-1s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="60" r="2" opacity="0.5"><animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="6s" begin="-2s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="370" r="2" opacity="0.5"><animateTransform attributeName="transform" type="translate" values="0,0;0,-12;0,0" dur="5.5s" begin="-3s" repeatCount="indefinite"/></circle>
  </g>

  <circle cx="400" cy="150" r="118" fill="none" stroke="#EC4899" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.65">
    <animateTransform attributeName="transform" type="rotate" from="0 400 150" to="360 400 150" dur="24s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="150" r="142" fill="none" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="3 9" opacity="0.5">
    <animateTransform attributeName="transform" type="rotate" from="360 400 150" to="0 400 150" dur="32s" repeatCount="indefinite"/>
  </circle>
  <g>
    <animateMotion dur="9s" repeatCount="indefinite" path="M 282,150 a118,118 0 1,0 236,0 a118,118 0 1,0 -236,0"/>
    <circle r="5" fill="#F9A8D4"/>
  </g>

  <g transform="translate(400,150)">
    <animateTransform attributeName="transform" type="translate" values="400,150;400,140;400,150" dur="5s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-5;5;-5" dur="7s" repeatCount="indefinite"/>
      <use href="#cube2" transform="scale(1.5)"/>
    </g>
  </g>
  <g transform="translate(120,120)" opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="120,120;120,106;120,120" dur="6s" repeatCount="indefinite"/>
    <use href="#cube2" transform="scale(0.6)"/>
  </g>
  <g transform="translate(688,140)" opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="688,140;688,154;688,140" dur="7s" begin="-3s" repeatCount="indefinite"/>
    <use href="#cube2" transform="scale(0.5)"/>
  </g>

  <g font-family="Verdana, Geneva, sans-serif" font-weight="bold" text-anchor="middle">
    <text x="406" y="306" font-size="47" letter-spacing="1" fill="#2D0A4E">MUHAMMAD USMAN TARIQ</text>
    <text x="403" y="303" font-size="47" letter-spacing="1" fill="#6D28D9">MUHAMMAD USMAN TARIQ</text>
    <text x="400" y="300" font-size="47" letter-spacing="1" fill="url(#nameGrad)">MUHAMMAD USMAN TARIQ</text>
  </g>

  <g font-family="Verdana, Geneva, sans-serif" font-size="13.5" fill="#F5F3FF">
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.4s" fill="freeze"/>
      <rect x="168" y="326" width="150" height="30" rx="15" fill="#8B5CF6" opacity="0.9"/>
      <text x="243" y="346" text-anchor="middle">📱 Mobile Engineer</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.9s" fill="freeze"/>
      <rect x="330" y="326" width="140" height="30" rx="15" fill="#EC4899" opacity="0.9"/>
      <text x="400" y="346" text-anchor="middle">🌐 Full Stack</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.4s" fill="freeze"/>
      <rect x="482" y="326" width="150" height="30" rx="15" fill="#7C3AED" opacity="0.9"/>
      <text x="557" y="346" text-anchor="middle">🚀 Open Source</text>
    </g>
  </g>

  <g fill="#EC4899">
    <rect x="316" y="384" width="5" height="18" rx="2.5"><animate attributeName="height" values="18;6;18" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="384;396;384" dur="1.1s" repeatCount="indefinite"/></rect>
    <rect x="330" y="384" width="5" height="18" rx="2.5"><animate attributeName="height" values="8;20;8" dur="0.9s" repeatCount="indefinite"/><animate attributeName="y" values="394;382;394" dur="0.9s" repeatCount="indefinite"/></rect>
    <rect x="344" y="384" width="5" height="18" rx="2.5"><animate attributeName="height" values="16;7;16" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="386;395;386" dur="1.3s" repeatCount="indefinite"/></rect>
    <rect x="358" y="384" width="5" height="18" rx="2.5"><animate attributeName="height" values="7;19;7" dur="1s" repeatCount="indefinite"/><animate attributeName="y" values="395;383;395" dur="1s" repeatCount="indefinite"/></rect>
    <rect x="372" y="384" width="5" height="18" rx="2.5"><animate attributeName="height" values="19;8;19" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="383;394;383" dur="1.2s" repeatCount="indefinite"/></rect>
    <rect x="386" y="384" width="5" height="18" rx="2.5"><animate attributeName="height" values="9;17;9" dur="0.95s" repeatCount="indefinite"/><animate attributeName="y" values="393;385;393" dur="0.95s" repeatCount="indefinite"/></rect>
    <rect x="400" y="384" width="5" height="18" rx="2.5"><animate attributeName="height" values="17;6;17" dur="1.15s" repeatCount="indefinite"/><animate attributeName="y" values="385;396;385" dur="1.15s" repeatCount="indefinite"/></rect>
    <rect x="414" y="384" width="5" height="18" rx="2.5"><animate attributeName="height" values="6;18;6" dur="1.05s" repeatCount="indefinite"/><animate attributeName="y" values="396;384;396" dur="1.05s" repeatCount="indefinite"/></rect>
    <rect x="428" y="384" width="5" height="18" rx="2.5"><animate attributeName="height" values="15;9;15" dur="1.25s" repeatCount="indefinite"/><animate attributeName="y" values="387;393;387" dur="1.25s" repeatCount="indefinite"/></rect>
    <rect x="442" y="384" width="5" height="18" rx="2.5"><animate attributeName="height" values="10;20;10" dur="0.85s" repeatCount="indefinite"/><animate attributeName="y" values="392;382;392" dur="0.85s" repeatCount="indefinite"/></rect>
    <rect x="456" y="384" width="5" height="18" rx="2.5"><animate attributeName="height" values="18;7;18" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="384;395;384" dur="1.1s" repeatCount="indefinite"/></rect>
    <rect x="470" y="384" width="5" height="18" rx="2.5"><animate attributeName="height" values="8;16;8" dur="1s" repeatCount="indefinite"/><animate attributeName="y" values="394;386;394" dur="1s" repeatCount="indefinite"/></rect>
  </g>
</svg>
