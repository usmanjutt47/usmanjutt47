<svg xmlns="http://www.w3.org/2000/svg" width="390" height="150" viewBox="0 0 390 150">
  <defs>
    <linearGradient id="pb1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
      <animate attributeName="x1" values="0%;60%;0%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="0%;60%;0%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="pc1"><rect x="1" y="1" width="388" height="148" rx="12"/></clipPath>
  </defs>
  <rect x="1" y="1" width="388" height="148" rx="12" fill="#14062B" stroke="url(#pb1)" stroke-width="2"/>
  <g clip-path="url(#pc1)">
    <rect x="-120" y="0" width="70" height="150" fill="#FFFFFF" opacity="0.06" transform="skewX(-18)">
      <animate attributeName="x" values="-160;520" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- phone mockup -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-4;0,0" dur="4.5s" repeatCount="indefinite"/>
    <rect x="26" y="22" width="56" height="106" rx="10" fill="#0B0118" stroke="#8B5CF6" stroke-width="2"/>
    <rect x="32" y="36" width="44" height="8" rx="4" fill="#EC4899"/>
    <rect x="32" y="50" width="44" height="8" rx="4" fill="#2D0A4E"/>
    <rect x="32" y="64" width="44" height="8" rx="4" fill="#2D0A4E"/>
    <rect x="32" y="78" width="44" height="8" rx="4" fill="#2D0A4E"/>
    <circle cx="54" cy="106" r="9" fill="none" stroke="#F9A8D4" stroke-width="2"/>
    <text x="54" y="111" text-anchor="middle" font-size="10" fill="#F9A8D4">🌍</text>
  </g>
  <text x="102" y="48" font-family="Verdana, Geneva, sans-serif" font-size="16" font-weight="bold" fill="#F9A8D4">expo-country-picker</text>
  <text x="102" y="72" font-family="Verdana, Geneva, sans-serif" font-size="11.5" fill="#DDD6FE">Country picker for React Native &amp; Expo —</text>
  <text x="102" y="89" font-family="Verdana, Geneva, sans-serif" font-size="11.5" fill="#DDD6FE">flags, dial codes, search &amp; multi-select.</text>
  <g font-family="Verdana, Geneva, sans-serif" font-size="10" fill="#F5F3FF">
    <rect x="102" y="106" width="86" height="19" rx="9.5" fill="#6D28D9"/><text x="145" y="119" text-anchor="middle">React Native</text>
    <rect x="196" y="106" width="46" height="19" rx="9.5" fill="#6D28D9"/><text x="219" y="119" text-anchor="middle">Expo</text>
    <rect x="250" y="106" width="70" height="19" rx="9.5" fill="#6D28D9"/><text x="285" y="119" text-anchor="middle">JavaScript</text>
  </g>
</svg>
