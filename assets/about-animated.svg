<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330">
  <defs>
    <linearGradient id="winGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <clipPath id="l1"><rect x="28" y="56" width="0" height="24"><animate attributeName="width" from="0" to="205" dur="1s" begin="0.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="l2"><rect x="28" y="83" width="0" height="24"><animate attributeName="width" from="0" to="380" dur="1.3s" begin="1.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="l3"><rect x="28" y="110" width="0" height="24"><animate attributeName="width" from="0" to="425" dur="1.4s" begin="2.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="l4"><rect x="28" y="137" width="0" height="24"><animate attributeName="width" from="0" to="290" dur="1s" begin="4.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="l5"><rect x="28" y="164" width="0" height="24"><animate attributeName="width" from="0" to="320" dur="1.1s" begin="5.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="l6"><rect x="28" y="191" width="0" height="24"><animate attributeName="width" from="0" to="16" dur="0.3s" begin="6.7s" fill="freeze"/></rect></clipPath>
  </defs>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-5;0,0" dur="7s" repeatCount="indefinite"/>
    <rect x="4" y="4" width="792" height="322" rx="14" fill="url(#winGrad)" stroke="#2563EB" stroke-width="2"/>
    <rect x="4" y="4" width="792" height="36" rx="14" fill="#1E293B"/>
    <circle cx="26" cy="22" r="6" fill="#F87171"/>
    <circle cx="48" cy="22" r="6" fill="#FACC15"/>
    <circle cx="70" cy="22" r="6" fill="#4ADE80"/>
    <text x="400" y="27" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="12.5" letter-spacing="2" fill="#94A3B8">about-me.swift</text>

    <g font-family="'Courier New', Courier, monospace" font-size="15.5">
      <text x="28" y="74" fill="#FF7B72" clip-path="url(#l1)">let usman = Developer(</text>
      <text x="28" y="101" fill="#E6EDF3" clip-path="url(#l2)">  role: <tspan fill="#A5D6FF">"Mobile Engineer &amp; Full Stack"</tspan>,</text>
      <text x="28" y="128" fill="#E6EDF3" clip-path="url(#l3)">  stack: [<tspan fill="#A5D6FF">"React Native", "Expo", "SwiftUI"</tspan>],</text>
      <text x="28" y="155" fill="#E6EDF3" clip-path="url(#l4)">  focus: <tspan fill="#A5D6FF">"Design -&gt; Production"</tspan>,</text>
      <text x="28" y="182" fill="#E6EDF3" clip-path="url(#l5)">  openSource: <tspan fill="#79C0FF">true</tspan>, hireable: <tspan fill="#79C0FF">true</tspan></text>
      <text x="28" y="209" fill="#FF7B72" clip-path="url(#l6)">)</text>
      <rect x="48" y="196" width="9" height="17" fill="#60A5FA" opacity="0">
        <animate attributeName="opacity" values="0;1;0;1;0;1;0;1" dur="3.2s" begin="7s" fill="freeze"/>
      </rect>
    </g>

    <g font-family="Verdana, Geneva, sans-serif" font-size="13" fill="#E6EDF3">
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="7.4s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" values="-24,0;0,0" dur="0.5s" begin="7.4s" fill="freeze"/>
        <rect x="28" y="248" width="172" height="34" rx="17" fill="#1E3A8A"/>
        <text x="114" y="270" text-anchor="middle">📱 React Native</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="7.9s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" values="-24,0;0,0" dur="0.5s" begin="7.9s" fill="freeze"/>
        <rect x="214" y="248" width="158" height="34" rx="17" fill="#1E3A8A"/>
        <text x="293" y="270" text-anchor="middle">🍎 Swift &amp; SwiftUI</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="8.4s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" values="-24,0;0,0" dur="0.5s" begin="8.4s" fill="freeze"/>
        <rect x="386" y="248" width="150" height="34" rx="17" fill="#1E3A8A"/>
        <text x="461" y="270" text-anchor="middle">⚡ Node.js APIs</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="8.9s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" values="-24,0;0,0" dur="0.5s" begin="8.9s" fill="freeze"/>
        <rect x="550" y="248" width="160" height="34" rx="17" fill="#1E3A8A"/>
        <text x="630" y="270" text-anchor="middle">📦 Open Source</text>
      </g>
    </g>
  </g>
</svg>
