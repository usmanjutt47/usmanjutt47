    <circle cx="36" cy="110" r="3" fill="#8B5CF6"/>
    <circle cx="70" cy="38" r="3" fill="#8B5CF6"/>
  </g>
  <text x="102" y="48" font-family="Verdana, Geneva, sans-serif" font-size="16" font-weight="bold" fill="#F9A8D4">Google-Maps-Scrapper</text>
  <text x="102" y="72" font-family="Verdana, Geneva, sans-serif" font-size="11.5" fill="#DDD6FE">Business leads from Google Maps into Excel —</text>
  <text x="102" y="89" font-family="Verdana, Geneva, sans-serif" font-size="11.5" fill="#DDD6FE">emails, phones &amp; websites, automatically.</text>
