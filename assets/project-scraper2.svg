<svg xmlns="http://www.w3.org/2000/svg" width="390" height="150" viewBox="0 0 390 150">
  <defs>
    <linearGradient id="pb2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
      <animate attributeName="x1" values="0%;60%;0%" dur="6s" begin="-3s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="0%;60%;0%" dur="6s" begin="-3s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="pc2"><rect x="1" y="1" width="388" height="148" rx="12"/></clipPath>
  </defs>
  <rect x="1" y="1" width="388" height="148" rx="12" fill="#14062B" stroke="url(#pb2)" stroke-width="2"/>
  <g clip-path="url(#pc2)">
    <rect x="-120" y="0" width="70" height="150" fill="#FFFFFF" opacity="0.06" transform="skewX(-18)">
      <animate attributeName="x" values="-160;520" dur="4.5s" begin="-2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- map with pin -->
  <g>
    <rect x="24" y="24" width="58" height="102" rx="8" fill="#0B0118" stroke="#8B5CF6" stroke-width="2"/>
    <path d="M24,58 H82 M24,92 H82 M53,24 V126" stroke="#2D0A4E" stroke-width="3"/>
    <g transform="translate(53,62)">
