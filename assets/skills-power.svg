<svg xmlns="http://www.w3.org/2000/svg" width="800" height="370" viewBox="0 0 800 370">
  <defs>
    <linearGradient id="panel2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B0533"/>
      <stop offset="100%" stop-color="#0B0118"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="792" height="362" rx="16" fill="url(#panel2)" stroke="#8B5CF6" stroke-width="2"/>

  <!-- developer character -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-6;0,0" dur="5s" repeatCount="indefinite"/>
    <circle cx="150" cy="118" r="34" fill="#FBBF24"/>
    <path d="M116,112 a34,34 0 0,1 68,0 l0,-8 a34,26 0 0,0 -68,0 z" fill="#1F2937"/>
    <rect x="112" y="152" width="76" height="66" rx="14" fill="#8B5CF6"/>
    <rect x="88" y="212" width="124" height="12" rx="6" fill="#374151"/>
    <rect x="96" y="176" width="108" height="40" rx="6" fill="#111827" stroke="#4B5563" stroke-width="2"/>
    <text x="150" y="202" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#4ADE80">&lt;/&gt;</text>
    <circle cx="138" cy="116" r="4" fill="#1F2937"/>
    <circle cx="162" cy="116" r="4" fill="#1F2937"/>
    <path d="M140,132 q10,7 20,0" stroke="#1F2937" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <g font-family="'Courier New', monospace" font-weight="bold">
    <text x="66" y="80" font-size="20" fill="#EC4899">{ }<animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="4s" repeatCount="indefinite"/></text>
    <text x="216" y="96" font-size="17" fill="#67E8F9">=&gt;<animateTransform attributeName="transform" type="translate" values="0,0;0,-12;0,0" dur="5s" begin="-1s" repeatCount="indefinite"/></text>
    <text x="52" y="290" font-size="16" fill="#A78BFA">const<animateTransform attributeName="transform" type="translate" values="0,0;0,-8;0,0" dur="4.5s" begin="-2s" repeatCount="indefinite"/></text>
    <text x="212" y="300" font-size="18" fill="#F9A8D4">;<animateTransform attributeName="transform" type="translate" values="0,0;0,-9;0,0" dur="3.8s" begin="-0.5s" repeatCount="indefinite"/></text>
  </g>
  <text x="150" y="338" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="12" letter-spacing="3" fill="#A78BFA">SKILL POWER</text>

  <!-- skill bars -->
  <g font-family="Verdana, Geneva, sans-serif">
    <text x="300" y="66" font-size="14" fill="#F5F3FF">React Native</text>
    <rect x="300" y="74" width="440" height="13" rx="6.5" fill="#2D0A4E"/>
    <rect x="300" y="74" width="0" height="13" rx="6.5" fill="url(#barGrad)"><animate attributeName="width" from="0" to="418" dur="1.4s" begin="0.3s" fill="freeze"/></rect>
    <text x="748" y="66" font-size="13" font-weight="bold" fill="#F9A8D4" opacity="0">95%<animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.6s" fill="freeze"/></text>

    <text x="300" y="118" font-size="14" fill="#F5F3FF">Expo</text>
    <rect x="300" y="126" width="440" height="13" rx="6.5" fill="#2D0A4E"/>
    <rect x="300" y="126" width="0" height="13" rx="6.5" fill="url(#barGrad)"><animate attributeName="width" from="0" to="405" dur="1.4s" begin="0.7s" fill="freeze"/></rect>
    <text x="748" y="118" font-size="13" font-weight="bold" fill="#F9A8D4" opacity="0">92%<animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2s" fill="freeze"/></text>

    <text x="300" y="170" font-size="14" fill="#F5F3FF">TypeScript</text>
    <rect x="300" y="178" width="440" height="13" rx="6.5" fill="#2D0A4E"/>
    <rect x="300" y="178" width="0" height="13" rx="6.5" fill="url(#barGrad)"><animate attributeName="width" from="0" to="396" dur="1.4s" begin="1.1s" fill="freeze"/></rect>
    <text x="748" y="170" font-size="13" font-weight="bold" fill="#F9A8D4" opacity="0">90%<animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.4s" fill="freeze"/></text>

    <text x="300" y="222" font-size="14" fill="#F5F3FF">Node.js</text>
    <rect x="300" y="230" width="440" height="13" rx="6.5" fill="#2D0A4E"/>
    <rect x="300" y="230" width="0" height="13" rx="6.5" fill="url(#barGrad)"><animate attributeName="width" from="0" to="387" dur="1.4s" begin="1.5s" fill="freeze"/></rect>
    <text x="748" y="222" font-size="13" font-weight="bold" fill="#F9A8D4" opacity="0">88%<animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.8s" fill="freeze"/></text>

    <text x="300" y="274" font-size="14" fill="#F5F3FF">Swift &amp; SwiftUI</text>
    <rect x="300" y="282" width="440" height="13" rx="6.5" fill="#2D0A4E"/>
    <rect x="300" y="282" width="0" height="13" rx="6.5" fill="url(#barGrad)"><animate attributeName="width" from="0" to="374" dur="1.4s" begin="1.9s" fill="freeze"/></rect>
    <text x="748" y="274" font-size="13" font-weight="bold" fill="#F9A8D4" opacity="0">85%<animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="3.2s" fill="freeze"/></text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="3.6s" fill="freeze"/>
    <rect x="300" y="318" width="440" height="30" rx="15" fill="#EC4899"/>
    <text x="520" y="338" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">⚡ DESIGN ➜ CODE ➜ APP STORE</text>
  </g>
</svg>
