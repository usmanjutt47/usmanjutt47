<svg xmlns="http://www.w3.org/2000/svg" width="800" height="130" viewBox="0 0 800 130">
  <defs>
    <radialGradient id="gold" cx="38%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#FDE68A"/><stop offset="100%" stop-color="#D97706"/>
    </radialGradient>
    <radialGradient id="blue" cx="38%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#93C5FD"/><stop offset="100%" stop-color="#1D4ED8"/>
    </radialGradient>
    <radialGradient id="purple" cx="38%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#C4B5FD"/><stop offset="100%" stop-color="#6D28D9"/>
    </radialGradient>
    <radialGradient id="green" cx="38%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#86EFAC"/><stop offset="100%" stop-color="#15803D"/>
    </radialGradient>
  </defs>
  <g font-family="Verdana, Geneva, sans-serif" text-anchor="middle">
    <circle cx="100" cy="45" r="30" fill="url(#gold)"><animate attributeName="r" values="30;32;30" dur="4s" repeatCount="indefinite"/></circle>
    <text x="100" y="53" font-size="20" font-weight="bold" fill="#451A03">★</text>
    <text x="100" y="98" font-size="17" font-weight="bold" fill="#F8FAFC">21,844</text>
    <text x="100" y="116" font-size="10.5" letter-spacing="1.5" fill="#94A3B8">CONTRIBUTIONS</text>

    <circle cx="300" cy="45" r="30" fill="url(#blue)"><animate attributeName="r" values="30;32;30" dur="4s" begin="-1s" repeatCount="indefinite"/></circle>
    <text x="300" y="53" font-size="20" font-weight="bold" fill="#172554">▲</text>
    <text x="300" y="98" font-size="17" font-weight="bold" fill="#F8FAFC">41 Days</text>
    <text x="300" y="116" font-size="10.5" letter-spacing="1.5" fill="#94A3B8">LONGEST STREAK</text>

    <circle cx="500" cy="45" r="30" fill="url(#purple)"><animate attributeName="r" values="30;32;30" dur="4s" begin="-2s" repeatCount="indefinite"/></circle>
    <text x="500" y="53" font-size="20" font-weight="bold" fill="#2E1065">◆</text>
    <text x="500" y="98" font-size="17" font-weight="bold" fill="#F8FAFC">3 Repos</text>
    <text x="500" y="116" font-size="10.5" letter-spacing="1.5" fill="#94A3B8">PUBLIC PROJECTS</text>

    <circle cx="700" cy="45" r="30" fill="url(#green)"><animate attributeName="r" values="30;32;30" dur="4s" begin="-3s" repeatCount="indefinite"/></circle>
    <text x="700" y="54" font-size="20" font-weight="bold" fill="#052E16">∞</text>
    <text x="700" y="98" font-size="17" font-weight="bold" fill="#F8FAFC">Open Source</text>
    <text x="700" y="116" font-size="10.5" letter-spacing="1.5" fill="#94A3B8">ALWAYS BUILDING</text>
  </g>
</svg>
